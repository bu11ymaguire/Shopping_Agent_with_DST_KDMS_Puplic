name: Offline smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install offline verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            httpx==0.28.1 \
            pydantic==2.12.5 \
            python-dotenv==1.2.1 \
            fastapi==0.128.0 \
            uvicorn==0.40.0 \
            langgraph==1.0.5 \
            duckdb==1.5.5

      - name: Compile Python and check browser JavaScript
        run: |
          python -m compileall -q app scripts
          node --check app/static/app.js

      - name: Run deterministic offline verifiers
        run: |
          for script in \
            verify_adapter.py \
            verify_understanding_schema.py \
            verify_understanding_evaluation.py \
            verify_actual_understanding_evaluation.py \
            verify_poster_live_replay.py \
            verify_tablet_domain_v2.py \
            verify_tablet_domain_dev.py \
            verify_tablet_domain_holdout.py \
            verify_tablet_domain_holdout_freeze.py \
            verify_mvp.py \
            verify_amazon_processing.py
          do
            python "scripts/$script"
          done
